<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>广东多模式气象预报查看器</title>
  <style>
    :root {
      --bg:#151a26; --panel:#20293c; --panel2:#272f42; --line:#3a4a6b;
      --line2:#405880; --txt:#e6edf7; --txt2:#b4c5e0; --txt3:#94a4c2; --txt4:#7889a8;
      --accent:#5294ff; --accent2:#82b8ff; --accentbg:#305894;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      font-family:"Microsoft YaHei","PingFang SC",sans-serif;
      background:var(--bg); color:var(--txt);
      display:flex; flex-direction:column; height:100vh; overflow:hidden;
    }
    header {
      height:34px; flex-shrink:0;
      background:linear-gradient(135deg,#232c40 0%,#2c446b 100%);
      border-bottom:1px solid var(--line2);
      display:flex; align-items:center; gap:8px; padding:0 12px;
      box-shadow:0 2px 12px rgba(0,0,0,.35);
    }
    header .icon { font-size:15px; flex-shrink:0; }
    header h1 { font-size:.95rem; font-weight:700; color:#a0c8ff; }
    header p  { font-size:.56rem; color:var(--txt3); margin-top:0; }

    .app-body { flex:1; display:flex; min-height:0; }

    /* ===== 左侧产品栏 ===== */
    .sidebar {
      width:254px; flex-shrink:0; overflow-y:auto;
      background:var(--panel); border-right:1px solid var(--line);
      padding:12px 10px 22px;
    }
    .sidebar::-webkit-scrollbar, .progress-row::-webkit-scrollbar { width:6px; height:6px; }
    .sidebar::-webkit-scrollbar-thumb, .progress-row::-webkit-scrollbar-thumb { background:var(--line2); border-radius:3px; }
    .sel-hint {
      font-size:.68rem; color:var(--accent2); background:rgba(82,148,255,.08);
      border:1px dashed rgba(82,148,255,.4); border-radius:8px;
      padding:7px 9px; margin-bottom:8px; line-height:1.5;
    }
    .clear-btn {
      width:100%; background:transparent; border:1px solid var(--line2); color:var(--txt3);
      border-radius:8px; padding:7px 10px; font-size:.74rem; font-weight:600; cursor:pointer;
      font-family:inherit; margin-bottom:12px; transition:all .12s;
    }
    .clear-btn:hover { border-color:#ff6b6b; color:#ff8a8a; background:rgba(239,68,68,.08); }
    .group-block { margin-bottom:6px; }
    .group-toggle {
      display:flex; align-items:center; gap:6px; width:100%;
      background:none; border:none; cursor:pointer; font-family:inherit;
      font-size:.72rem; color:var(--txt3); font-weight:700;
      letter-spacing:.4px; text-transform:uppercase;
      padding:5px 4px; border-bottom:1px solid var(--line); margin-bottom:6px;
      transition:color .15s;
    }
    .group-toggle:hover { color:var(--accent2); }
    .group-toggle .caret {
      display:inline-block; font-size:.62rem; color:var(--accent);
      transition:transform .15s; flex-shrink:0;
    }
    .group-block.collapsed .group-toggle .caret { transform:rotate(-90deg); }
    .group-block.collapsed .prod-list { display:none; }
    .group-block.active .group-toggle { color:var(--accent2); }
    .prod-list { display:flex; flex-direction:column; gap:3px; }
    .prod-btn {
      text-align:left; background:var(--panel2); border:1px solid var(--line);
      color:var(--txt2); border-radius:7px; padding:6px 9px;
      font-size:.78rem; font-weight:600; cursor:pointer;
      font-family:inherit; transition:all .12s;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .prod-btn:hover { border-color:var(--accent); color:#d4e4ff; background:#2c446b; }
    .prod-btn.active {
      background:var(--accentbg); border-color:var(--accent); color:var(--accent2);
      box-shadow:0 0 0 2px rgba(82,148,255,.22);
    }
    .prod-btn.active::before { content:"✓ "; color:#b4d4ff; }

    /* ===== 主区 ===== */
    .main { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }

    .toolbar {
      flex-shrink:0; display:flex; flex-wrap:wrap; gap:6px; align-items:flex-end;
      background:var(--panel); border-bottom:1px solid var(--line);
      padding:4px 12px;
    }
    .control-group { display:flex; flex-direction:column; gap:5px; }
    .control-group label {
      font-size:.7rem; color:var(--txt2); font-weight:600; letter-spacing:.4px; text-transform:uppercase;
    }
    .control-group input[type="date"], .control-group select {
      background:var(--panel2); border:1px solid var(--line2); color:var(--txt);
      border-radius:5px; padding:4px 7px; font-size:.78rem;
      font-family:inherit; outline:none; cursor:pointer; transition:border-color .2s;
    }
    .control-group input[type="date"]:hover, .control-group select:hover { border-color:var(--accent); }
    .control-group input[type="date"]:focus, .control-group select:focus {
      border-color:var(--accent2); box-shadow:0 0 0 3px rgba(82,148,255,.18);
    }
    .control-group select:disabled {
      opacity:.4; cursor:not-allowed; border-color:var(--line);
    }
    input[type="date"]::-webkit-calendar-picker-indicator { filter:invert(.8); cursor:pointer; }
    .selected-count {
      background:var(--accentbg); border:1px solid var(--accent); color:var(--accent2);
      border-radius:5px; padding:5px 10px; font-size:.76rem; font-weight:700;
      font-variant-numeric:tabular-nums; white-space:nowrap; align-self:flex-end;
    }
    .btn-go {
      background:linear-gradient(135deg,#306ed8,#2458bc); color:#fff; border:none;
      border-radius:5px; padding:6px 15px; font-size:.8rem; font-weight:600; cursor:pointer;
      transition:all .2s; font-family:inherit; white-space:nowrap; align-self:flex-end;
    }
    .btn-go:hover {
      background:linear-gradient(135deg,#4484ee,#306ed8);
      transform:translateY(-1px); box-shadow:0 4px 12px rgba(82,148,255,.38);
    }

    .stepbar {
      flex-shrink:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      background:var(--panel); border-bottom:1px solid var(--line);
      padding:3px 12px;
    }
    .step-info { flex:1; display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-width:200px; }
    .step-info .item .label { font-size:.68rem; color:var(--txt3); }
    .step-info .item .value {
      font-size:.8rem; font-weight:700; color:var(--accent2); font-variant-numeric:tabular-nums;
    }
    .nav-btns { display:flex; gap:8px; }
    .btn-nav {
      background:var(--panel2); color:var(--accent2); border:1px solid var(--line2);
      border-radius:5px; padding:5px 10px; font-size:.74rem; font-weight:600;
      cursor:pointer; transition:all .15s; font-family:inherit; user-select:none;
    }
    .btn-nav:hover:not(:disabled) {
      background:var(--accentbg); border-color:var(--accent); color:#d4e4ff; transform:translateY(-1px);
    }
    .btn-nav:active:not(:disabled) { transform:translateY(0); }
    .btn-nav:disabled { opacity:.35; cursor:not-allowed; }
    .keyboard-hint { display:flex; gap:10px; align-items:center; margin-left:auto; }
    .keyboard-hint span { font-size:.66rem; color:var(--txt4); }
    .keyboard-hint kbd {
      background:var(--panel2); border:1px solid var(--line2); border-radius:4px;
      padding:1px 5px; font-size:.62rem; color:var(--txt3); font-family:inherit;
    }

    .progress-row {
      flex-shrink:0; display:flex; gap:3px; padding:2px 12px 0; background:var(--panel);
      overflow-x:auto; overflow-y:hidden; white-space:nowrap;
    }
    .progress-dot {
      flex:0 0 14px; height:6px; background:var(--panel2); border-radius:3px;
      cursor:pointer; transition:background .15s, transform .12s;
    }
    .progress-dot:hover { background:var(--accent); transform:scaleY(1.7); }
    .progress-dot.active { background:var(--accent2); }

    .url-strip {
      flex-shrink:0; display:none; flex-wrap:wrap; gap:4px 14px;
      padding:1px 12px 4px; background:var(--panel); border-bottom:1px solid var(--line);
    }
    .url-strip a {
      color:var(--txt4); font-size:.62rem; word-break:break-all; text-decoration:none;
      font-family:"Consolas",monospace; transition:color .2s; max-width:46%;
    }
    .url-strip a:hover { color:var(--accent2); }

    /* ===== 图片网格 ===== */
    .grid-area { flex:1; min-height:0; padding:8px 10px; display:flex; flex-direction:column; }
    .grid {
      flex:1; min-height:0; display:none;
      grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,1fr);
      gap:4px; transition:opacity .12s;
    }
    .grid.show { display:grid; }
    .grid.fade { opacity:0; }
    .grid-item {
      position:relative; display:block; border:1px solid var(--line); border-radius:10px;
      overflow:hidden; background:var(--panel2); text-decoration:none;
      box-shadow:0 3px 10px rgba(0,0,0,.22); transition:border-color .15s, box-shadow .15s;
    }
    .grid-item:hover { border-color:var(--accent); box-shadow:0 6px 20px rgba(82,148,255,.3); }
    .grid-item img { width:100%; height:100%; object-fit:contain; display:block; transition:opacity .18s; }
    .grid-item .badge {
      position:absolute; top:6px; left:8px; display:flex; gap:6px; align-items:center;
      pointer-events:none; flex-wrap:wrap;
    }
    .grid-item .close-btn {
      position:absolute; top:6px; right:8px; z-index:3;
      width:20px; height:20px; line-height:18px; text-align:center;
      background:rgba(20,26,40,.85); border:1px solid rgba(255,255,255,.3);
      color:#ffb4b4; border-radius:50%; font-size:.9rem; font-weight:700;
      cursor:pointer; user-select:none; transition:all .15s;
    }
    .grid-item .close-btn:hover { background:rgba(239,68,68,.92); color:#fff; border-color:#fff; }
    .grid-item .badge span {
      background:rgba(20,26,40,.82); border:1px solid rgba(82,148,255,.45);
      color:var(--accent2); border-radius:6px; padding:2px 7px;
      font-size:.7rem; font-weight:700; backdrop-filter:blur(2px); white-space:nowrap;
    }
    .grid-item .badge span.vt { color:var(--txt3); border-color:rgba(64,88,128,.6); font-weight:600; }
    .grid-item .cell-load, .grid-item .cell-err {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      padding:10px; text-align:center;
    }
    .grid-item .cell-load { color:var(--txt4); font-size:.74rem; }
    .grid-item .cell-err { background:rgba(20,26,40,.86); color:#ff8a8a; font-size:.8rem; }
    .grid-item.placeholder {
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
      border-style:dashed; border-color:var(--line); background:var(--panel);
      color:var(--txt4); font-size:.78rem; text-align:center; padding:12px;
    }
    .grid-item.placeholder .ph-prod { color:var(--txt3); font-weight:700; font-size:.8rem; }

    .empty-state {
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:12px; text-align:center; color:var(--txt3);
    }
    .empty-state .big-icon { font-size:52px; opacity:.45; }
    .empty-state p { font-size:.9rem; }
    .empty-state p.sub { font-size:.76rem; color:var(--txt4); }

    .err-toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
      background:rgba(239,68,68,.94); color:#fff; border-radius:10px; padding:9px 16px;
      font-size:.8rem; box-shadow:0 4px 20px rgba(0,0,0,.35); z-index:99;
      opacity:0; transition:opacity .3s; pointer-events:none; max-width:92%; text-align:center;
    }
    .err-toast.show { opacity:1; }
    .loading-badge {
      position:fixed; bottom:24px; right:16px;
      background:rgba(28,34,48,.9); border:1px solid var(--line2); border-radius:20px;
      padding:5px 12px; display:flex; align-items:center; gap:6px; font-size:.74rem; color:var(--txt3);
      z-index:98; opacity:0; transition:opacity .25s; pointer-events:none;
    }
    .loading-badge.show { opacity:1; }
    .mini-spinner {
      width:12px; height:12px; border:2px solid var(--panel2); border-top-color:var(--accent2);
      border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    @media(max-width:1000px){
      .app-body { flex-direction:column; }
      .sidebar { width:100%; max-height:170px; }
    }
  </style>
</head>
<body>
<header>
  <span class="icon">🌀</span>
  <div>
    <h1>广东多模式气象预报查看器</h1>
    <p>ECMWF / CMA-GD / CMA-TRAMS / ECMWF‑Fine 华南产品·单产品多时次 / 多产品对比·请勿随意外传数值产品！（推荐电脑端浏览器使用本平台）</p>
  </div>
</header>
<div class="app-body">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="toolbar">
      <div class="control-group">
        <label>起报日期（UTC）</label>
        <input type="date" id="dateInput" />
      </div>
      <div class="control-group">
        <label>起报时次（UTC Z）</label>
        <select id="hourSelect">
          <option value="00">00 Z</option>
          <option value="12">12 Z</option>
          <option value="18">18 Z·TRAMS才有</option>
        </select>
      </div>
      <div class="control-group">
        <label>最大预报步长</label>
        <select id="maxStepSelect">
          <option value="96">96 h</option>
          <option value="120">120 h</option>
          <option value="240" selected>240 h</option>
          <option value="360">360 h</option>
        </select>
      </div>
      <div class="control-group">
        <label>时间间隔（每张）</label>
        <select id="timeIntervalSelect">
          <option value="">默认（产品自带）</option>
          <option value="3">3 小时</option>
          <option value="6">6 小时</option>
          <option value="12">12 小时</option>
          <option value="24">24 小时</option>
        </select>
      </div>
      <div class="control-group">
        <label>显示模式</label>
        <select id="modeSelect">
          <option value="single" selected>单产品 · 多时次</option>
          <option value="multi">多产品 · 同时对比</option>
        </select>
      </div>
      <div class="control-group">
        <label>同时显示（张）</label>
        <select id="gridSizeSelect">
          <option value="1"selected>1 张</option>
          <option value="2">2 张</option>
          <option value="4">4 张</option>
          <option value="6">6 张</option>
          <option value="8">8 张</option>
          <option value="10">10 张</option>
        </select>
      </div>
      <div class="control-group">
        <label>已选产品</label>
        <div class="selected-count" id="selectedCount">1 个</div>
      </div>
      <button class="btn-go" onclick="loadSeries()">▶ 加载</button>
    </div>
    <div class="stepbar">
      <div class="step-info">
        <div class="item"><div class="label" id="info1Label">预报步长</div><div class="value" id="info1Value">—</div></div>
        <div class="item"><div class="label" id="info2Label">对应 UTC 时间</div><div class="value" id="info2Value">—</div></div>
        <div class="item"><div class="label" id="info3Label">序号</div><div class="value" id="info3Value">—</div></div>
      </div>
      <div class="nav-btns">
        <button class="btn-nav" id="btnPrev" onclick="navigate(-1)">◀ 上一张</button>
        <button class="btn-nav" id="btnNext" onclick="navigate(1)">下一张 ▶</button>
      </div>
      <div class="keyboard-hint">
        <span><kbd>←</kbd> <span id="hintPrev">上一张</span></span>
        <span><kbd>→</kbd> <span id="hintNext">下一张</span></span>
      </div>
    </div>
    <div class="progress-row" id="progressRow"></div>
    <div class="url-strip" id="urlStrip"></div>
    <div class="grid-area">
      <div class="empty-state" id="emptyState">
        <div class="big-icon">🗺️</div>
        <p id="emptyMain">选择产品、UTC日期与00Z/12Z时次，点击加载查看预报图</p>
        <p class="sub" id="emptySub">单产品模式：同屏显示该产品的1/2/4/6/8 个连续时次；多产品模式：选中几个产品就同屏对比显示几张</p>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </main>
</div>
<div class="loading-badge" id="loadingBadge">
  <div class="mini-spinner"></div><span>加载中…</span>
</div>
<div class="err-toast" id="errToast"></div>
<script>
// ===================== 产品定义（保持原样） =====================
// ECMWF‑HN：降雨保持原间隔，其余非降雨全部改为3h间隔
const ECMWF_HN = [
  { id: 'mslp',        label: '地面气压',    fileKey: 'mslp',                      startStep:0, stepInterval:3 },
  { id: 'rain3',       label: '3h降水',     fileKey: 'rain3',                     startStep:3, stepInterval:3 },
  { id: 'rain6',       label: '6h降水',     fileKey: 'rain6',                     startStep:6, stepInterval:6 },
  { id: 'rain24',      label: '24h降水',    fileKey: 'rain24',                    startStep:24, stepInterval:24 },
  { id: 'wind10m',     label: '10风',       fileKey: 'wind10m',                   startStep:0, stepInterval:3 },
  { id: 'hghtwind200', label: '200高度',    fileKey: 'wind200stream200hght200',   startStep:0, stepInterval:3 },
  { id: 'hghtwind500', label: '500高度',    fileKey: 'wind500hght500temp500',     startStep:0, stepInterval:3 },
  { id: 'wind850',     label: '850风',      fileKey: 'wind850hght500',            startStep:0, stepInterval:3 },
  { id: 'wind925',     label: '925风',      fileKey: 'wind925',                    startStep:0, stepInterval:3 },
  { id: 'rhum850',     label: '850RH',      fileKey: 'rhum850',                   startStep:0, stepInterval:3 },
  { id: 'vflux925',    label: '925水汽',    fileKey: 'vflux925',                  startStep:0, stepInterval:3 },
  { id: 'cape',        label: 'CAPE',       fileKey: 'cape',                      startStep:0, stepInterval:3 }
];
// GTRAMS3KMEC‑HN：全部非降雨产品从000起步，1h间隔；降雨不变
const GTRAMS_HN = [
  { id: 'mslp',        label: '地面气压',    fileKey: 'mslp',                      startStep:0, stepInterval:1 },
  { id: 'rain3',       label: '3h降水',     fileKey: 'rain3',                     startStep:3, stepInterval:3 },
  { id: 'rain6',       label: '6h降水',     fileKey: 'rain6',                     startStep:6, stepInterval:6 },
  { id: 'rain24',      label: '24h降水',    fileKey: 'rain24',                    startStep:24, stepInterval:24 },
  { id: 'wind10m',     label: '10风',       fileKey: 'wind10m',                   startStep:0, stepInterval:1 },
  { id: 'hghtwind200', label: '200高度',    fileKey: 'wind200stream200hght200',   startStep:0, stepInterval:1 },
  { id: 'hghtwind500', label: '500高度',    fileKey: 'wind500hght500temp500',     startStep:0, stepInterval:1 },
  { id: 'wind850',     label: '850风',      fileKey: 'wind850hght500',            startStep:0, stepInterval:1 },
  { id: 'rhum700',     label: '700RH',      fileKey: 'rhum700',                   startStep:0, stepInterval:1 },
  { id: 'rhum850',     label: '850RH',      fileKey: 'rhum850',                   startStep:0, stepInterval:1 },
  { id: 'vflux850',    label: '850水汽',    fileKey: 'vflux850',                  startStep:0, stepInterval:1 },
  { id: 'vflux925',    label: '925水汽',    fileKey: 'vflux925',                  startStep:0, stepInterval:1 },
  { id: 'cape',        label: 'CAPE',       fileKey: 'cape',                      startStep:0, stepInterval:1 }
];
// GRAPES9‑HN：除台风产品，其余3h间隔
const GRAPES9_HN = [
  { id: 'mslp',        label: '地面气压',    fileKey: 'mslp',                      startStep:0, stepInterval:3 },
  { id: 'rain6',       label: '6h降水',     fileKey: 'rain6',                     startStep:6, stepInterval:6 },
  { id: 'hghtwind200', label: '200高度',    fileKey: 'wind200stream200hght200',   startStep:0, stepInterval:3 },
  { id: 'rhum850',     label: '850RH',      fileKey: 'rhum850',                   startStep:0, stepInterval:3 },
  { id: 'hghtwind500', label: '500高度',    fileKey: 'wind500hght500temp500',     startStep:0, stepInterval:3 },
  { id: 'kindex',      label: 'K指数',      fileKey: 'kiki',                     startStep:0, stepInterval:3 },
  { id: 'rain24',      label: '24h降水',    fileKey: 'rain24',                    startStep:24, stepInterval:24 },
  { id: 'wind10m',     label: '10风',       fileKey: 'wind10m',                   startStep:0, stepInterval:3 },
  { id: 'wind850',     label: '850风',      fileKey: 'wind850hght500',            startStep:0, stepInterval:3 },
  { id: 'rhum700',     label: '700RH',      fileKey: 'rhum700',                   startStep:0, stepInterval:3 },
  { id: 'typhoon_track', label:'台风路径(暂无)',  fileKey:'typhoon_track',              startStep:0, stepInterval:6 },
  { id: 'typhoon_intensity', label:'台风强度(暂无)',fileKey:'typhoon_intensity',        startStep:0, stepInterval:6 }
];
// ECMWF‑Fine华南产品（hn）【新增总云量tcdc】
const TRAMS_HN = [
  { id: 'mslp',        label: '海平面气压',        fileKey:'mslp',            folder:'mslp',         region:'hn', startStep:0, stepInterval:24 },
  { id: 't2m',         label: '2米温度',           fileKey:'t2mm',            folder:'t2mm',         region:'hn', startStep:0, stepInterval:24 },

function pad(n, len = 2) { return String(n).padStart(len, '0'); }

// 网格布局：保证全部同屏完整显示
function layoutFor(n) {
  if (n <= 1) return { cols:1, rows:1 };
  if (n <= 2) return { cols:2, rows:1 };
  if (n <= 3) return { cols:3, rows:1 };   // 3 张一排
  if (n <= 4) return { cols:2, rows:2 };   // 4 张 2×2
  if (n <= 6) return { cols:3, rows:2 };   // 5 / 6
  if (n <= 8) return { cols:4, rows:2 };   // 7 / 8
  return { cols:5, rows:2 };               // 9 / 10
}
// 行高 = min(按图 4:3 比例自然高, 同屏均分可用高)：既保证整页同屏完整显示，又尽量填满列宽不显空
function fitGridRows(grid, cols, rows) {
  if (!grid || !cols || !rows) return;
  const prevDisp = grid.style.display;
  grid.style.display = 'grid';
  // 4张(2×2)与6张(3×2/2×3)取消图间间隔，图完全挨着（其余档位保持默认间隙）
  const isTight = (cols === 2 && rows === 2) || (cols === 3 && rows === 2) || (cols === 2 && rows === 3);
  grid.style.gap = isTight ? '0' : '';
  const gap = parseFloat(getComputedStyle(grid).rowGap) || 4;
  const colW = (grid.clientWidth - (cols - 1) * gap) / cols;
  const naturalH = Math.max(30, Math.round(colW * 0.75));
  const area = grid.parentElement;
  const acs = getComputedStyle(area);
  const avail = (area.clientHeight || grid.clientHeight)
    - (parseFloat(acs.paddingTop) || 0) - (parseFloat(acs.paddingBottom) || 0);
  const maxH = Math.max(30, Math.floor((avail - (rows - 1) * gap) / rows));
  grid.style.gridTemplateRows = `repeat(${rows}, ${Math.min(naturalH, maxH)}px)`;
  grid.style.display = prevDisp;
}


// ===================== URL 构建 =====================
function buildUrlFor(model, type, dateHH, stepH) {
  const fileNameKey = type.fileKey;
  const region = type.region || "gd";
  const folder = type.folder || region;
  if (model === "trams") {
    return `https://gd12121.com/wb/getfile/date/ecmwf_fine/${region}/${folder}/ecmwffine_${region}_${fileNameKey}_${pad(stepH,3)}_${cycleStr}.png`;
  }
  // 资料目录按发布规则组织：12Z 起报的图片目录日期 = 起报UTC日期 + 1 天（00Z 用当天）
  let dirDate = dateHH.slice(0, 8);
  if (dateHH.slice(8, 10) === '12' || dateHH.slice(8, 10) === '18') {
    const d = new Date(Date.UTC(+dateHH.slice(0,4), +dateHH.slice(4,6)-1, +dateHH.slice(6,8)));
    d.setUTCDate(d.getUTCDate() + 1);
    dirDate = `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}`;
  }
  const dateDash = `${dirDate.slice(0,4)}-${dirDate.slice(4,6)}-${dirDate.slice(6,8)}`;
  let prefix;
  switch (model) {
    case "gtrams": prefix = "GTRAMS3KMEC_hn_"; break;
    case "grapes9": prefix = "grapes9_hn_"; break;
    default: prefix = "ecmwffine_hn_";
  }
  return `https://oss.windbells.cn/numerical/${dateDash}/NUMERICAL_/${prefix}${fileNameKey}_${pad(stepH,3)}_${dateHH}.png`;
}
function parseDate(dateHH) {
  return new Date(Date.UTC(+dateHH.slice(0,4), +dateHH.slice(4,6)-1, +dateHH.slice(6,8), +dateHH.slice(8,10)));
}
function formatValidTime(base, stepH) {
  const t = new Date(base.getTime() + stepH * 3600000);
  return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())} ${pad(t.getUTCHours())}:00 UTC`;
}
function hasStep(sel, s) {
  const t = sel.type;
  const it = t.stepInterval || 24;
  return s >= t.startStep && (s - t.startStep) % it === 0;
}

function toggleProduct(model, type) {

// ===================== 步长与导航 =====================
function rebuildSteps() {
  if (!selected.length) {
    steps = [];
    currentIdx = 0;
    currentPage = 0;
    buildProgressDots();
    renderGrid();
    return;
  }
  const maxStep  = parseInt(document.getElementById('maxStepSelect').value);
  const override = parseInt(document.getElementById('timeIntervalSelect').value) || 0;
  const set = new Set();
  if (override > 0) {
    for (let s = 0; s <= maxStep; s += override) set.add(s);
  } else {
    const list = (mode === 'single') ? [selected[0]] : selected;
    list.forEach(sel => {
      const t = sel.type;
      const it = t.stepInterval || 24;
      for (let s = t.startStep; s <= maxStep; s += it) set.add(s);
    });
  }
  steps = [...set].sort((a, b) => a - b);
  if (currentIdx >= steps.length) currentIdx = 0;
  if (currentIdx < 0) currentIdx = 0;
  if (currentPage >= pageCount()) currentPage = pageCount() - 1;
  if (currentPage < 0) currentPage = 0;
  buildProgressDots();
  renderGrid();
}
function pageCount() {
  if (mode === 'single') return Math.max(1, Math.ceil(steps.length / gridSize));
  return Math.max(1, steps.length);
}
function loadSeries() {
  if (!selected.length) { alert('请先在左侧选择产品！'); return; }
  const dateVal = document.getElementById('dateInput').value;
  const hour    = document.getElementById('hourSelect').value;
  if (!dateVal) { alert('请先选择UTC起报日期！'); return; }
  dateStr = dateVal.replace(/-/g, '') + hour;
  cycleStr = hour;
  currentIdx = 0;
  currentPage = 0;
  rebuildSteps();
}
function buildProgressDots() {
  const row = document.getElementById('progressRow');
  row.innerHTML = '';
  const n = pageCount();
  for (let i = 0; i < n; i++) {
    const dot = document.createElement('div');
    const active = mode === 'single' ? (i === currentPage) : (i === currentIdx);
    dot.className = 'progress-dot' + (active ? ' active' : '');
    dot.title = mode === 'single' ? `第 ${i+1} 页` : `+${pad(steps[i],3)}h`;
    dot.addEventListener('click', () => {
      if (mode === 'single') { currentPage = i; renderGrid(); }
      else { currentIdx = i; renderGrid(); }
    });
    row.appendChild(dot);
  }
}
function updateProgressDots() {
  document.querySelectorAll('.progress-dot').forEach((d, i) => {
    const active = mode === 'single' ? (i === currentPage) : (i === currentIdx);
    d.classList.toggle('active', active);
  });
}
function navigate(dir) {
  if (!steps.length) return;
  if (mode === 'single') {
    const next = currentPage + dir;
    if (next < 0 || next >= pageCount()) return;
    currentPage = next;
    renderGrid();
  } else {
    const next = currentIdx + dir;
    if (next < 0 || next >= steps.length) return;
    currentIdx = next;
    renderGrid();
  }
}
function setStepbar(l1, v1, l2, v2, l3, v3) {
  document.getElementById('info1Label').textContent = l1;
  document.getElementById('info1Value').textContent = v1;
  document.getElementById('info2Label').textContent = l2;
  document.getElementById('info2Value').textContent = v2;
  document.getElementById('info3Label').textContent = l3;
  document.getElementById('info3Value').textContent = v3;
}

// ===================== 渲染网格 =====================
// 已跳过/关闭的时次（单产品模式，跨翻页保持），键 = model:typeId:step
let hiddenSteps = new Set();
function stepKey(sel, s) { return `${sel.model}:${sel.type.id}:${dateStr}:${s}`; }
// 从 startIdx 起连续取 count 个未隐藏时次（被跳过/关闭的自动向后顺延补位）
function visibleStepsForPage(startIdx, count) {
  const sel = selected[0];
  const out = [];
  for (let i = startIdx; i < steps.length && out.length < count; i++) {
    const s = steps[i];
    if (!hiddenSteps.has(stepKey(sel, s))) out.push(s);
  }
  return out;
}
// 创建单产品模式的一张卡片（含加载图、角标、右上角关闭按钮）
function makeSingleCell(sel, s, base, ctx) {
  const url = buildUrlFor(sel.model, sel.type, dateStr, s);
  const item = document.createElement('a');
  item.className = 'grid-item';
  item.dataset.step = s;
  item.href = url; item.target = '_blank'; item.title = '新标签打开原图';
  const loadDiv = document.createElement('div');
  loadDiv.className = 'cell-load';
  loadDiv.textContent = `加载中 +${pad(s,3)}h …`;
  item.appendChild(loadDiv);
  const img = document.createElement('img');
  img.alt = url;
  img.style.opacity = '0';
  ctx.pending++;
  img.onload = () => {
    if (ctx.serial !== loadSerial) return;
    loadDiv.remove();
    img.style.opacity = '1';
    if (--ctx.pending <= 0) showBadge(false);
  };
  img.onerror = () => {
    if (ctx.serial !== loadSerial) return;
    if (--ctx.pending <= 0) showBadge(false);
    removeSingleCell(item, s);
  };
  img.src = url;
  item.appendChild(img);
  const badge = document.createElement('div');
  badge.className = 'badge';
  const sp1 = document.createElement('span'); sp1.textContent = `${sel.type.label} +${pad(s,3)}h`;
  const sp2 = document.createElement('span'); sp2.className = 'vt'; sp2.textContent = formatValidTime(base, s);
  badge.appendChild(sp1); badge.appendChild(sp2);
  item.appendChild(badge);
  // 右上角 × 手动关闭这一张
  const close = document.createElement('span');
  close.className = 'close-btn';
  close.textContent = '×';
  close.title = '关闭这一张';
  close.onclick = (e) => { e.preventDefault(); e.stopPropagation(); removeSingleCell(item, s); };
  item.appendChild(close);
  return item;
}
// 移除某一张（手动关闭或加载失败自动跳过），并从后续时次自动补位保持满格
function removeSingleCell(item, s) {
  if (!item || !item.parentNode) return;
  const sel = selected[0];
  if (sel) hiddenSteps.add(stepKey(sel, s));
  item.remove();
  const strip = document.getElementById('urlStrip');
  [...strip.querySelectorAll('a')].forEach(a => {
    if (a.textContent === `+${pad(s,3)}h`) a.remove();
  });
  fillNextCell(sel);
}
// 把后续时次的图补进当前页（始终显示满）；无可补时次则紧凑重排
function fillNextCell(sel) {
  const grid = document.getElementById('grid');
  const shown = new Set([...grid.querySelectorAll('.grid-item')].map(it => parseInt(it.dataset.step)));
  const next = steps.find(s => !hiddenSteps.has(stepKey(sel, s)) && !shown.has(s));
  if (next === undefined) { recompactSingle(); return; }
  const base = parseDate(dateStr);
  const item = makeSingleCell(sel, next, base, { serial: loadSerial, pending: 0 });
  grid.appendChild(item);
  updateSingleInfo();
}
function updateSingleInfo() {
  const grid = document.getElementById('grid');
  const items = [...grid.querySelectorAll('.grid-item')];
  if (!items.length) return;
  const base = parseDate(dateStr);
  const stepsNow = items.map(it => parseInt(it.dataset.step)).sort((a, b) => a - b);
  const t0 = formatValidTime(base, stepsNow[0]);
  const t1 = formatValidTime(base, stepsNow[stepsNow.length-1]);
  setStepbar('步长范围', `+${pad(stepsNow[0],3)} ~ +${pad(stepsNow[stepsNow.length-1],3)} h`,
             '对应 UTC 时间', stepsNow.length > 1 ? `${t0} ～ ${t1}` : t0,
             '页码', `${currentPage+1} / ${pageCount()}`);
}
function recompactSingle() {
  const grid = document.getElementById('grid');
  if (!grid) return;
  const items = [...grid.querySelectorAll('.grid-item')];
  if (!items.length) {
    grid.classList.remove('show');
    const empty = document.getElementById('emptyState');
    if (empty) {
      empty.style.display = 'flex';
      document.getElementById('emptyMain').textContent = '该页时次均已跳过或关闭';
      document.getElementById('emptySub').textContent = '加载失败/手动关闭的时次已自动跳过；点击“清空已选产品”可恢复。';
    }
    setStepbar('步长范围', '—', '对应 UTC 时间', '—', '页码', `${currentPage+1} / ${pageCount()}`);
    showBadge(false);
    return;
  }
  const n = items.length;
  const { cols, rows } = layoutFor(n);
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  fitGridRows(grid, cols, rows);
  updateSingleInfo();
}
function renderGrid() {
  if (!steps.length) return;
  const serial = ++loadSerial;
  if (mode === 'single') { renderSingle(serial); return; }
  renderMulti(serial);
}

function renderSingle(serial) {
  const sel  = selected[0];
  const base = parseDate(dateStr);
  const pages = pageCount();
  if (currentPage >= pages) currentPage = pages - 1;
  const start     = currentPage * gridSize;
  // 取满 gridSize 张：被跳过/关闭的时次自动向后顺延补位
  const visSteps  = visibleStepsForPage(start, gridSize);

  const grid  = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  const strip = document.getElementById('urlStrip');

  document.getElementById('btnPrev').textContent = '◀ 上一页';
  document.getElementById('btnNext').textContent = '下一页 ▶';
  document.getElementById('hintPrev').textContent = '上一页';
  document.getElementById('hintNext').textContent = '下一页';
  document.getElementById('btnPrev').disabled = currentPage === 0;
  document.getElementById('btnNext').disabled = currentPage >= pages - 1;
  updateProgressDots();

  if (!visSteps.length) {
    setStepbar('步长范围', '—', '对应 UTC 时间', '—', '页码', `${currentPage+1} / ${pages}`);
    strip.style.display = 'none';
    strip.innerHTML = '';
    grid.classList.remove('show');
    grid.innerHTML = '';
    if (empty) {
      empty.style.display = 'flex';
      document.getElementById('emptyMain').textContent = '该页时次均已跳过或关闭';
      document.getElementById('emptySub').textContent = '加载失败/手动关闭的时次已自动跳过；点击“清空已选产品”可恢复。';
    }
    showBadge(false);
    return;
  }

  const { cols, rows } = layoutFor(visSteps.length);
  const t0 = formatValidTime(base, visSteps[0]);
  const t1 = formatValidTime(base, visSteps[visSteps.length-1]);
  setStepbar('步长范围', `+${pad(visSteps[0],3)} ~ +${pad(visSteps[visSteps.length-1],3)} h`,
             '对应 UTC 时间', visSteps.length > 1 ? `${t0} ～ ${t1}` : t0,
             '页码', `${currentPage+1} / ${pages}`);

  strip.style.display = 'flex';
  strip.innerHTML = '';
  visSteps.forEach(s => {
    const a = document.createElement('a');
    const url = buildUrlFor(sel.model, sel.type, dateStr, s);
    a.href = url; a.target = '_blank'; a.title = url;
    a.textContent = `+${pad(s,3)}h`;
    strip.appendChild(a);
  });

  if (empty) empty.style.display = 'none';
  grid.classList.add('fade');
  grid.innerHTML = '';
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  fitGridRows(grid, cols, rows);
  grid.classList.add('show');

  showBadge(true);
  const ctx = { serial, pending: 0 };
  visSteps.forEach(s => {
    grid.appendChild(makeSingleCell(sel, s, base, ctx));
  });
  requestAnimationFrame(() => {
    if (serial !== loadSerial) return;
    grid.classList.remove('fade');
    fitGridRows(grid, cols, rows);   // 布局稳定后校准行高
  });
}

function renderMulti(serial) {
  const s = steps[currentIdx];
  const base = parseDate(dateStr);
  const { cols, rows } = layoutFor(selected.length);

  setStepbar('预报步长', `+${pad(s,3)} h`,
             '对应 UTC 时间', formatValidTime(base, s),
             '序号', `${currentIdx+1} / ${steps.length}`);
  document.getElementById('btnPrev').textContent = '◀ 上一张';
  document.getElementById('btnNext').textContent = '下一张 ▶';
  document.getElementById('hintPrev').textContent = '上一张';
  document.getElementById('hintNext').textContent = '下一张';
  document.getElementById('btnPrev').disabled = currentIdx === 0;
  document.getElementById('btnNext').disabled = currentIdx === steps.length - 1;
  updateProgressDots();

  const strip = document.getElementById('urlStrip');
  strip.style.display = 'flex';
  strip.innerHTML = '';
  selected.forEach(sel => {
    if (!hasStep(sel, s)) return;
    const a = document.createElement('a');
    const url = buildUrlFor(sel.model, sel.type, dateStr, s);
    a.href = url; a.target = '_blank'; a.title = url;
    const g = GROUPS.find(x => x.id === sel.model);
    a.textContent = `${selected.length > 1 ? g.short + ' ' : ''}${sel.type.label} +${pad(s,3)}h`;
    strip.appendChild(a);
  });

  const grid  = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  if (empty) empty.style.display = 'none';
  grid.classList.add('fade');
  grid.innerHTML = '';
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  fitGridRows(grid, cols, rows);
  grid.classList.add('show');

  showBadge(true);
  let pending = 0;
  selected.forEach(sel => {
    if (!hasStep(sel, s)) {
      const ph = document.createElement('div');
      ph.className = 'grid-item placeholder';
      const g = GROUPS.find(x => x.id === sel.model);
      const name = document.createElement('span');
      name.className = 'ph-prod';
      name.textContent = `${selected.length > 1 ? g.short + ' ' : ''}${sel.type.label}`;
      const msg = document.createElement('span');
      msg.textContent = `该产品无 +${pad(s,3)} h 时次`;
      ph.appendChild(name);
      ph.appendChild(msg);
      grid.appendChild(ph);
      return;
    }
    const url = buildUrlFor(sel.model, sel.type, dateStr, s);
    const item = document.createElement('a');
    item.className = 'grid-item';
    item.href = url; item.target = '_blank'; item.title = '新标签打开原图';
    const loadDiv = document.createElement('div');
    loadDiv.className = 'cell-load';
    loadDiv.textContent = `加载中 +${pad(s,3)}h …`;
    item.appendChild(loadDiv);
    const img = document.createElement('img');
    img.alt = url;
    img.style.opacity = '0';
    pending++;
    img.onload = () => {
      if (serial !== loadSerial) return;
      loadDiv.remove();
      img.style.opacity = '1';
      if (--pending <= 0) showBadge(false);
    };
    img.onerror = () => {
      if (serial !== loadSerial) return;
      loadDiv.remove();
      const err = document.createElement('div');
      err.className = 'cell-err';
      err.textContent = '图片加载失败\n该时次可能暂未发布';
      item.appendChild(err);
      if (--pending <= 0) showBadge(false);
    };
    img.src = url;
    item.appendChild(img);
    const badge = document.createElement('div');
    badge.className = 'badge';
    const g = GROUPS.find(x => x.id === sel.model);
    const sp1 = document.createElement('span');
    sp1.textContent = `${selected.length > 1 ? g.short + ' ' : ''}${sel.type.label} +${pad(s,3)}h`;
    const sp2 = document.createElement('span'); sp2.className = 'vt'; sp2.textContent = formatValidTime(base, s);
    badge.appendChild(sp1); badge.appendChild(sp2);
    item.appendChild(badge);
    grid.appendChild(item);
  });
  requestAnimationFrame(() => {
    if (serial !== loadSerial) return;
    grid.classList.remove('fade');
    fitGridRows(grid, cols, rows);   // 布局稳定后校准行高
  });
}

// ===================== 提示与错误 =====================
let badgeTimer = null;
function showBadge(on) {
  const el = document.getElementById('loadingBadge');
  clearTimeout(badgeTimer);
  if (on) { el.classList.add('show'); }
  else { badgeTimer = setTimeout(() => el.classList.remove('show'), 200); }
}
let toastTimer = null;
function showErr(msg) {
  const el = document.getElementById('errToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ===================== 事件 =====================
document.getElementById('modeSelect').addEventListener('change', () => {
  mode = document.getElementById('modeSelect').value;
  document.getElementById('gridSizeSelect').disabled = mode !== 'single';
  if (mode === 'single' && selected.length > 1) {
    selected = [selected[0]];
  }
  updateSidebar();
  if (steps.length) rebuildSteps();
});
document.getElementById('gridSizeSelect').addEventListener('change', () => {
  gridSize = parseInt(document.getElementById('gridSizeSelect').value, 10);
  if (steps.length && mode === 'single') rebuildSteps();
});
document.getElementById('timeIntervalSelect').addEventListener('change', () => {
  if (steps.length) rebuildSteps();
});
document.addEventListener('keydown', e => {
  if (!steps.length) return;
  if (e.key === 'ArrowLeft')  navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});

(function init() {
  const now = new Date();
  document.getElementById('dateInput').value =
    `${now.getUTCFullYear()}-${pad(now.getUTCMonth()+1)}-${pad(now.getUTCDate())}`;
  document.getElementById('gridSizeSelect').disabled = false;
  buildSidebar();
})();
</script>
</body>
